[project]
name = "cyvora"
version = "0.1.0"
description = "CYVORA Autonomous Trading Platform — local Windows foundation"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyside6>=6.8",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[project.scripts]
cyvora-api = "apps.api.main:main"
cyvora-desktop = "apps.desktop.main:main"

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-qt>=4.4",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "config", "database", "domain", "monitoring"]

[tool.hatch.build.targets.wheel.force-include]
"apps/desktop/themes/cyvora.qss" = "apps/desktop/themes/cyvora.qss"

# NautilusTrader is intentionally absent in Phase 1.
# The recorded stable candidate is 1.231.0 on Python 3.13. See TECHNICAL_DECISIONS.md.
# Pre-release 2.x is not a project dependency.

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["apps", "config", "database", "domain", "monitoring", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "database", "domain", "monitoring"]

[tool.ruff.lint.per-file-ignores]
"database/migrations/env.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
qt_api = "pyside6"

[tool.mypy]
python_version = "3.13"
packages = ["apps", "config", "database", "domain", "monitoring"]
exclude = ["database/migrations"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
strict_equality = true
