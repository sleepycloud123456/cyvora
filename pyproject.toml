[project]
name = "cyvora"
version = "0.9.1"
description = "CYVORA Autonomous Trading Platform — simulation and paper broker"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyside6>=6.8",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
    "httpx2>=2.16",
    "nautilus-trader==1.231.0",
]

[project.scripts]
cyvora-api = "apps.api.main:main"
cyvora-desktop = "apps.desktop.main:main"
cyvora-supervisor = "operations.startup:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-qt>=4.4",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "apps",
    "config",
    "database",
    "domain",
    "integrations",
    "intelligence",
    "monitoring",
    "shield",
    "trading",
    "backtesting",
    "terminal",
    "operations",
    "readiness",
]

[tool.hatch.build.targets.wheel.force-include]
"apps/desktop/themes/cyvora.qss" = "apps/desktop/themes/cyvora.qss"

# Stable NautilusTrader 1.231.0 on Python 3.13. Do not add a 2.x pre-release.
# See docs/architecture/TECHNICAL_DECISIONS.md.

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = [
    "apps",
    "config",
    "database",
    "domain",
    "integrations",
    "intelligence",
    "monitoring",
    "shield",
    "tests",
    "trading",
    "backtesting",
    "terminal",
    "operations",
    "readiness",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = [
    "apps",
    "config",
    "database",
    "domain",
    "integrations",
    "intelligence",
    "monitoring",
    "shield",
    "trading",
    "backtesting",
    "terminal",
    "operations",
    "readiness",
]

[tool.ruff.lint.per-file-ignores]
"database/migrations/env.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
qt_api = "pyside6"

[tool.mypy]
python_version = "3.13"
packages = [
    "apps",
    "config",
    "database",
    "domain",
    "integrations",
    "intelligence",
    "monitoring",
    "shield",
    "trading",
    "backtesting",
    "terminal",
    "operations",
    "readiness",
]
exclude = ["database/migrations"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["nautilus_trader", "nautilus_trader.*"]
ignore_missing_imports = true
